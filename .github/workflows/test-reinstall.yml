name: test-reinstall

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: DDImage URL
        required: true
        default: https://releaseprivate.pages.dev/release?token=abc&filename=vpsapp&tag=dd

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Download bin456789 reinstall.sh
        run: |
          curl -fsSL https://raw.githubusercontent.com/bin456789/reinstall/main/reinstall.sh -o reinstall.sh

      - name: Stop after image type detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reinstall.sh')
          s = p.read_text()
          old = """    setos_dd() {
              # raw 包含 vhd
              test_url $img 'raw raw.gzip raw.xz raw.zstd raw.tar.gzip raw.tar.xz raw.tar.zstd' img_type
          """
          new = old + """              echo "REINSTALL_TYPE_OK=$img_type"
              exit 0
          """
          if old not in s:
              raise SystemExit('setos_dd detection block not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Run reinstall.sh DD image detection
        run: |
          set -o pipefail
          bash reinstall.sh dd \
            --username test \
            --password test \
            --img '${{ inputs.image_url }}' 2>&1 | tee reinstall.log
          grep -E 'File type:|REINSTALL_TYPE_OK=' reinstall.log
          grep -q 'REINSTALL_TYPE_OK=raw.zstd' reinstall.log
