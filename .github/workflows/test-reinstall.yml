name: test-reinstall

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: DDImage URL
        required: true
        default: https://releaseprivate.pages.dev/release?token=abc&filename=vpsapp&tag=dd

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Download bin456789 reinstall.sh
        run: |
          curl -fsSL https://raw.githubusercontent.com/bin456789/reinstall/main/reinstall.sh -o reinstall.sh

      - name: Stop after image type detection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('reinstall.sh')
          s = p.read_text()
          pattern = r"(^[ \t]*test_url \$img 'raw raw\.gzip raw\.xz raw\.zstd raw\.tar\.gzip raw\.tar\.xz raw\.tar\.zstd' img_type$)"
          repl = r"\1\n" + "              echo \"REINSTALL_TYPE_OK=$img_type\"\n              exit 0\n"
          s2, n = re.subn(pattern, repl, s, flags=re.M)
          if n != 1:
              raise SystemExit(f'expected one detection line, patched {n}')
          p.write_text(s2)
          PY

      - name: Run reinstall.sh DD image detection
        run: |
          set -o pipefail
          sudo -E bash reinstall.sh dd \
            --username test \
            --password test \
            --img '${{ inputs.image_url }}' 2>&1 | tee reinstall.log
          grep -E 'File type:|REINSTALL_TYPE_OK=' reinstall.log
          grep -q 'File type: raw.zstd' reinstall.log
