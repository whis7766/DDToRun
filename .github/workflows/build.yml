name: Build Alpine VPS App Runner Image
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business binary download URL (blank = no app-runner)"
        required: false
        type: string
      release_tag:
        description: "Release tag"
        required: true
        default: "dd"
        type: string
      image_size_gb:
        description: "Image size in GB"
        required: true
        default: "1"
        type: string
      alpine_branch:
        description: "Alpine branch"
        required: false
        default: "edge"
        type: string
      cgo_compat:
        description: "Install glibc compat layer (gcompat/libc6-compat/libstdc++) for dynamic CGO binaries. Off = pure static Go only, smaller image."
        required: true
        default: "false"
        type: string
      headless_ssh:
        description: "Optional lightweight SSH-only build: drop VGA/fbterm/CJK font, run app as supervised service on SSH port 3389. Default = VGA kiosk, no SSH."
        required: true
        default: false
        type: boolean
      cjk_tty:
        description: "Enable fbterm + CJK font on the VGA tty1 console (default enabled; disable for a smaller ASCII-only image)."
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Build app-runner
        env:
          GOEXPERIMENT: "simd,jsonv2,newinliner,runtimefreegc,greenteagc,sizespecializedmalloc,mapsplitgroup"
        run: |
          cd build/vendor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 goamd64=v3 go build -trimpath \
            -ldflags "-s -w" -o app-runner app-runner.go

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zerofree zstd

      - name: Build image
        env:
          APP_URL: "${{ github.event.inputs.app_url }}"
          IMAGE_SIZE_GB: "${{ github.event.inputs.image_size_gb }}"
          ALPINE_BRANCH: "${{ github.event.inputs.alpine_branch }}"
          CGO_COMPAT: "${{ github.event.inputs.cgo_compat }}"
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
          CJK_TTY: "${{ github.event.inputs.cjk_tty }}"
        run: |
          sudo -E bash build/build.sh

      - name: Compress
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -un):$(id -gn)" .
          RAW="vps-app-runner.img.raw"
          ZST="vpsapp"
          zstd -q -22 --ultra --long=27 -f "$RAW" -o "$ZST"

      - name: QEMU KVM boot test
        env:
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
          APP_URL: "${{ github.event.inputs.app_url }}"
        run: |
          set -u
          sudo apt-get install -y qemu-system-x86 cpu-checker netcat-openbsd
          echo "=== KVM diagnostics ==="
          ls -la /dev/kvm 2>/dev/null || echo "no /dev/kvm"
          sudo kvm-ok 2>&1
          sudo modprobe kvm 2>/dev/null
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules 2>/dev/null
          sudo udevadm trigger --name-match=kvm 2>/dev/null
          sudo chmod 666 /dev/kvm 2>/dev/null
          ls -la /dev/kvm 2>/dev/null
          echo "=== end diagnostics ==="
          cd "$GITHUB_WORKSPACE/dist"
          zstd -d -f vpsapp -o test.img
          mkdir -p guest-edit
          sudo mount -o loop,offset=1048576 test.img guest-edit
          sudo sed -i 's|^\(\s*APPEND\s\+.*\)|\1 console=ttyS0|' guest-edit/boot/extlinux.conf
          sudo cat guest-edit/boot/extlinux.conf
          sudo umount guest-edit

          rm -f console.log qemu-stderr.log qemu-monitor.sock
          echo "Starting QEMU KVM..."
          qemu-system-x86_64 \
            -enable-kvm \
            -m 512 -smp 2 \
            -drive format=raw,file=test.img,if=virtio \
            -netdev user,id=n0 -device virtio-net,netdev=n0 \
            -vga std \
            -nographic \
            -serial file:console.log \
            -monitor unix:qemu-monitor.sock,server,nowait \
            -display none >qemu-stderr.log 2>&1 &
          QPID=$!
          echo "QEMU pid=$QPID"

          boot_ok=0
          for i in $(seq 1 75); do
            sleep 2
            if grep -q "Starting local" console.log 2>/dev/null; then
              echo "Boot completed after $((i*2))s"
              boot_ok=1
              break
            fi
            if grep -qE "Kernel panic|emergency recovery shell|Mounting root: failed|mounting root: failed" console.log 2>/dev/null; then
              echo "FAIL: early boot failure detected"
              break
            fi
          done
          sleep 45

          echo "system_powerdown" | nc -U qemu-monitor.sock 2>/dev/null || true
          for i in $(seq 1 15); do
            kill -0 "$QPID" 2>/dev/null || break
            sleep 1
          done
          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true

          echo "=== console log ==="
          cat console.log 2>/dev/null || echo "(no console.log)"
          echo "=== end log ==="
          echo "=== qemu stderr ==="
          cat qemu-stderr.log 2>/dev/null
          echo "=== end stderr ==="

          if grep -q "Kernel panic" console.log 2>/dev/null; then
            echo "FAIL: kernel panic"; exit 1
          fi
          if grep -qE "Mounting root: failed|mounting root: failed" console.log 2>/dev/null; then
            echo "FAIL: root mount failed"; exit 1
          fi
          if grep -q "emergency recovery shell" console.log 2>/dev/null; then
            echo "FAIL: emergency shell"; exit 1
          fi
          if grep -q "network is unreachable" console.log 2>/dev/null; then
            echo "FAIL: network unreachable"; exit 1
          fi
          if [ "$boot_ok" -ne 1 ]; then
            echo "FAIL: OpenRC local startup marker not reached"; exit 1
          fi
          echo "PASS: KVM boot reached OpenRC local"

          mkdir -p guest-root
          sudo mount -o ro,loop,offset=1048576 test.img guest-root
          echo "=== grow-root stamp ==="
          sudo cat guest-root/var/lib/grow-root.done 2>/dev/null || true
          if [ ! -s guest-root/var/lib/grow-root.done ]; then
            echo "FAIL: root auto-grow stamp missing"; sudo umount guest-root; exit 1
          fi
          echo "PASS: root auto-grow completed"

          echo "=== DHCP evidence ==="
          sudo find guest-root/var/lib/dhcpcd guest-root/run/dhcpcd -type f 2>/dev/null | sort
          if ! sudo find guest-root/var/lib/dhcpcd guest-root/run/dhcpcd -type f -size +0c 2>/dev/null | grep -q . \
             && ! grep -qE "lease of|bound to|eth0.*inet " console.log 2>/dev/null; then
            echo "FAIL: no DHCP lease evidence"; sudo umount guest-root; exit 1
          fi
          echo "PASS: DHCP evidence present"

          if [ -n "$APP_URL" ]; then
            echo "=== app-runner log ==="
            sudo tail -80 guest-root/var/log/app-runner.log 2>/dev/null || true
            if ! sudo grep -q "downloaded new version" guest-root/var/log/app-runner.log 2>/dev/null; then
              echo "FAIL: business download not recorded in guest log"; sudo umount guest-root; exit 1
            fi
            echo "PASS: business download completed"
          fi

          if [ "$HEADLESS_SSH" = "true" ]; then
            if ! sudo test -L guest-root/etc/runlevels/default/sshd; then
              echo "FAIL: sshd not enabled"; sudo umount guest-root; exit 1
            fi
            if ! grep -q "Starting sshd" console.log 2>/dev/null; then
              echo "FAIL: sshd service not found in boot log"; sudo umount guest-root; exit 1
            fi
            echo "PASS: sshd service started"
          fi
          sudo umount guest-root

      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-dd}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"
      - name: Move release tag to current commit
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          git tag -f "${TAG}" HEAD
          git push origin "refs/tags/${TAG}" --force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body: ""
          files: |
            dist/vpsapp

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0