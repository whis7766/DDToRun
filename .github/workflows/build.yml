name: Build Alpine VPS Image

# Two flavors are built in parallel and published together to one release tag:
#   vpsvga - VGA kiosk: fbterm + CJK font on tty1, no SSH
#   vpsssh - headless: sshd on port 22 (key-only), app as a supervised service
#
# This workflow only builds and publishes. Every real-machine test runs on the
# PVE host (see pve-test.yml), never on a runner.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business binary URL (blank keeps the default compiled into app-runner)"
        required: false
        type: string
      release_tag:
        description: "Release tag to publish to"
        required: true
        default: "dd"
        type: string
      image_size_gb:
        description: "Image size in GB"
        required: true
        default: "1"
        type: string
      alpine_branch:
        description: "Alpine branch"
        required: false
        default: "v3.22"
        type: string
      cgo_compat:
        description: "Install glibc compat layer (gcompat/libc6-compat) for a dynamic-glibc binary"
        required: true
        default: "false"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: vpsvga, headless: "false" }
          - { asset: vpsssh, headless: "true" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Build app-runner
        env:
          GOEXPERIMENT: "simd,jsonv2,newinliner,runtimefreegc,greenteagc,sizespecializedmalloc,mapsplitgroup"
          APP_URL: "${{ inputs.app_url }}"
        run: |
          cd build/vendor
          # The default URL lives in app-runner.go only; an explicit app_url
          # input overrides it through -X.
          LDFLAGS="-s -w"
          if [ -n "$APP_URL" ]; then
            LDFLAGS="$LDFLAGS -X main.appURL=$APP_URL"
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v3 \
            go build -trimpath -ldflags "$LDFLAGS" -o app-runner app-runner.go
          stat -c '%n %s bytes' app-runner

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zerofree zstd

      - name: Build image (${{ matrix.asset }})
        env:
          APP_URL: "${{ inputs.app_url }}"
          IMAGE_SIZE_GB: "${{ inputs.image_size_gb }}"
          ALPINE_BRANCH: "${{ inputs.alpine_branch }}"
          CGO_COMPAT: "${{ inputs.cgo_compat }}"
          HEADLESS_SSH: "${{ matrix.headless }}"
        run: |
          # Do not use `sudo -E`: recent sudo builds ignore it and silently
          # drop every variable, which would build the wrong profile. Pass the
          # inputs explicitly through env instead.
          sudo env \
            APP_URL="$APP_URL" \
            IMAGE_SIZE_GB="$IMAGE_SIZE_GB" \
            ALPINE_BRANCH="$ALPINE_BRANCH" \
            CGO_COMPAT="$CGO_COMPAT" \
            HEADLESS_SSH="$HEADLESS_SSH" \
            bash build/build.sh

      - name: Compress to ${{ matrix.asset }}
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -un):$(id -gn)" .
          # -19 gives virtually the same ratio as -22 --ultra in about half
          # the wall time; keep the large window for the 1GB raw.
          zstd -q -19 --long=27 -f vps-app-runner.img.raw -o "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"
          stat -c '%n %s bytes' "${{ matrix.asset }}"

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          retention-days: 1

  publish:
    name: Publish both assets to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download both compressed assets
        uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Move release tag to current commit
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          git tag -f "$TAG" HEAD
          git push origin "refs/tags/$TAG" --force

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body: ""
          files: |
            dist/vpsvga
            dist/vpsssh
            dist/vpsvga.sha256
            dist/vpsssh.sha256

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
