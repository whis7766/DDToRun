name: Build Alpine VPS App Runner Image
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business binary download URL (blank = no app-runner)"
        required: false
        type: string
      release_tag:
        description: "Release tag"
        required: true
        default: "dd"
        type: string
      image_size_gb:
        description: "Image size in GB"
        required: true
        default: "1"
        type: string
      alpine_branch:
        description: "Alpine branch (edge = validated full kernel+network stack; v3.22 stable = smaller boot image)"
        required: false
        default: "edge"
        type: string
      cgo_compat:
        description: "Install glibc compat layer (gcompat/libc6-compat/libstdc++) for dynamic CGO binaries. Off = pure static Go only, smaller image."
        required: true
        default: "false"
        type: string
      headless_ssh:
        description: "Optional lightweight SSH-only build: drop VGA/fbterm/CJK font, run app as supervised service on SSH port 3389. Default = VGA kiosk, no SSH."
        required: true
        default: false
        type: boolean
      cjk_tty:
        description: "Enable fbterm + CJK font on the VGA tty1 console (default enabled; disable for a smaller ASCII-only image)."
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Build app-runner
        env:
          GOEXPERIMENT: "simd,jsonv2,newinliner,runtimefreegc,greenteagc,sizespecializedmalloc,mapsplitgroup"
        run: |
          cd build/vendor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 goamd64=v3 go build -trimpath \
            -ldflags "-s -w" -o app-runner app-runner.go

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zerofree zstd

      - name: Build image
        env:
          APP_URL: "${{ github.event.inputs.app_url }}"
          IMAGE_SIZE_GB: "${{ github.event.inputs.image_size_gb }}"
          ALPINE_BRANCH: "${{ github.event.inputs.alpine_branch }}"
          CGO_COMPAT: "${{ github.event.inputs.cgo_compat }}"
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
          CJK_TTY: "${{ github.event.inputs.cjk_tty }}"
        run: |
          sudo -E bash build/build.sh

      - name: Compress
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -un):$(id -gn)" .
          RAW="vps-app-runner.img.raw"
          ZST="vpsapp"
          zstd -q -22 --ultra --long=27 -f "$RAW" -o "$ZST"
          ls -lh "$RAW" "$ZST"
          stat -c '%n %s bytes' "$RAW" "$ZST"

      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-dd}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"
      - name: Move release tag to current commit
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          git tag -f "${TAG}" HEAD
          git push origin "refs/tags/${TAG}" --force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body: ""
          files: |
            dist/vpsapp

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0