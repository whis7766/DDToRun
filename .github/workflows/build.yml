name: Build Alpine VPS App Runner Image

# Two flavors are built in parallel and published together to the release tag:
#   vpsvga - default VGA kiosk (fbterm + CJK font on tty1), no SSH
#   vpsssh - headless SSH-only (sshd on port 22, key-only; app as supervised service)
# Production build only: no QEMU/serial debug steps in this workflow.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business binary download URL (blank = no app-runner)"
        required: false
        type: string
      release_tag:
        description: "Release tag"
        required: true
        default: "dd"
        type: string
      image_size_gb:
        description: "Image size in GB"
        required: true
        default: "1"
        type: string
      alpine_branch:
        description: "Alpine branch (v3.22 stable = official virt baseline, smaller and reproducible)"
        required: false
        default: "v3.22"
        type: string
      cgo_compat:
        description: "Install glibc compat layer (gcompat/libc6-compat) for a dynamic-glibc business binary. Default false = pure static only, smaller image."
        required: true
        default: "false"
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build ${{ matrix.profile.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - { asset: vpsvga, headless_ssh: "false", cjk_tty: "true" }
          - { asset: vpsssh, headless_ssh: "true",  cjk_tty: "false" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: false

      - name: Build app-runner
        env:
          GOEXPERIMENT: "simd,jsonv2,newinliner,runtimefreegc,greenteagc,sizespecializedmalloc,mapsplitgroup"
        run: |
          cd build/vendor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 goamd64=v3 go build -trimpath \
            -ldflags "-s -w" -o app-runner app-runner.go

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zerofree zstd

      - name: Build image (${{ matrix.profile.asset }})
        env:
          APP_URL: "${{ github.event.inputs.app_url }}"
          IMAGE_SIZE_GB: "${{ github.event.inputs.image_size_gb }}"
          ALPINE_BRANCH: "${{ github.event.inputs.alpine_branch }}"
          CGO_COMPAT: "${{ github.event.inputs.cgo_compat }}"
          HEADLESS_SSH: "${{ matrix.profile.headless_ssh }}"
          CJK_TTY: "${{ matrix.profile.cjk_tty }}"
        run: |
          sudo -E bash build/build.sh

      - name: Compress to ${{ matrix.profile.asset }}
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -un):$(id -gn)" .
          RAW="vps-app-runner.img.raw"
          OUT="${{ matrix.profile.asset }}"
          zstd -q -22 --ultra --long=27 -f "$RAW" -o "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          ls -lh "$OUT"
          stat -c '%n %s bytes' "$OUT"

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.profile.asset }}
          path: |
            dist/${{ matrix.profile.asset }}
            dist/${{ matrix.profile.asset }}.sha256
          retention-days: 1

  publish:
    name: Publish both assets to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download both compressed assets
        uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-dd}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Remove superseded legacy asset (vpsapp)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'vpsapp'; then
              gh release delete-asset "$TAG" vpsapp --yes || true
              echo "removed legacy asset vpsapp"
            fi
          else
            echo "release $TAG does not exist yet; nothing to clean"
          fi

      - name: Move release tag to current commit
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          git tag -f "${TAG}" HEAD
          git push origin "refs/tags/${TAG}" --force

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body: ""
          files: |
            dist/vpsvga
            dist/vpsssh

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
