name: Boot Test

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business app URL"
        required: true
      release_tag:
        description: "Release tag to test"
        required: true
        default: "dd"

jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"

      - name: Build app-runner
        run: |
          cd build/vendor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o app-runner app-runner.go

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 debootstrap parted e2fsprogs dosfstools zstd cpio busybox-static

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          kvm-ok

      - name: Build image
        run: |
          chmod +x build/build.sh
          sudo env APP_URL="${{ github.event.inputs.app_url }}" \
          RELEASE_TAG="${{ github.event.inputs.release_tag }}" \
          IMAGE_SIZE_GB=1 \
          ALPINE_BRANCH=edge \
          CGO_COMPAT=false \
          bash build/build.sh

      - name: Add serial console to syslinux
        run: |
          sudo chown -R runner:runner dist
          cd dist
          ls -la
          RAW=$(ls *.raw *.img 2>/dev/null | head -1)
          echo "Found raw image: $RAW"
          cp "$RAW" test.img
          # Mount partition 1 (offset 2048*512=1048576) and add console=ttyS0 to syslinux cfg
          mkdir -p mnt
          sudo mount -o loop,offset=1048576 test.img mnt
          sudo sed -i 's|APPEND|APPEND console=ttyS0|' mnt/boot/extlinux.conf
          cat mnt/boot/extlinux.conf
          # Also run app-runner on serial console so we can see download output
          sudo sed -i 's|tty1::respawn|ttyS0::respawn|' mnt/etc/inittab
          echo "--- modified inittab ---"
          grep tty mnt/etc/inittab
          # On serial, skip fbterm entirely
          sudo bash -c 'printf "#!/bin/sh\nprintf \"nameserver 119.29.29.29\\nnameserver 223.5.5.5\\n\" > /etc/resolv.conf 2>/dev/null\nexec /usr/local/sbin/app-runner\n" > mnt/usr/local/sbin/app-runner-fb.sh'
          sudo chmod +x mnt/usr/local/sbin/app-runner-fb.sh
          cat mnt/usr/local/sbin/app-runner-fb.sh
          sudo umount mnt

      - name: Boot with KVM
        run: |
          cd dist
          qemu-system-x86_64 \
            -enable-kvm \
            -m 512 -smp 2 \
            -drive format=raw,file=test.img,if=virtio \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -nographic -serial mon:stdio \
            -display none > boot.log 2>&1 &
          QPID=$!
          echo "QEMU pid=$QPID"

          # Phase 1: wait for boot
          for i in $(seq 1 30); do
            sleep 2
            if grep -q "Starting local" boot.log 2>/dev/null; then
              echo "Boot completed after $((i*2))s"
              break
            fi
            if grep -q "Kernel panic" boot.log 2>/dev/null; then
              echo "FAIL: kernel panic"
              kill $QPID; exit 1
            fi
          done

          # Phase 2: wait for app-runner download (up to 120s)
          echo "Waiting for app-runner download..."
          for i in $(seq 1 60); do
            sleep 2
            if grep -qE "app-runner.*starting|fetch attempt|downloaded|尚无可|no app available|尚未有" boot.log 2>/dev/null; then
              echo "app-runner output detected after $((i*2))s"
              break
            fi
          done

          sleep 15
          kill $QPID 2>/dev/null || true
          wait $QPID 2>/dev/null || true

          echo "=== boot log (last 100 lines) ==="
          tail -100 boot.log

          # Checks
          if grep -q "Kernel panic" boot.log; then
            echo "FAIL: kernel panic"; exit 1
          fi
          if grep -q "mounting root: failed" boot.log; then
            echo "FAIL: root mount failed"; exit 1
          fi
          if grep -q "emergency recovery shell" boot.log; then
            echo "FAIL: emergency shell"; exit 1
          fi
          # Check root auto-grow
          if ! grep -q "Growing root filesystem" boot.log; then
            echo "FAIL: root auto-grow not detected"; exit 1
          fi
          echo "PASS: root auto-grow detected"
          # Check network DHCP
          if ! grep -q "lease of" boot.log; then
            echo "FAIL: no DHCP lease"; exit 1
          fi
          echo "PASS: DHCP lease obtained"
          # Check app-runner started
          if ! grep -qE "app-runner|fetch|download|starting" boot.log; then
            echo "FAIL: app-runner never started"; exit 1
          fi
          echo "PASS: app-runner started"
