name: Independent KVM Boot Test

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Business binary download URL"
        required: false
        type: string
        default: "https://furryfree.pages.dev/release?token=jaJ81HfL&filename=subs-check_linux_amd64v3&tag=ctyun"
      headless_ssh:
        description: "Test SSH-only lightweight variant"
        required: true
        default: false
        type: boolean
      cjk_tty:
        description: "Test CJK VGA console components (ignored for headless SSH)"
        required: true
        default: true
        type: boolean
      image_size_gb:
        description: "Raw image size in GB"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  kvm-boot-test:
    name: KVM boot, grow, DHCP, download
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Build static app-runner
        run: |
          cd build/vendor
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 goamd64=v3 go build -trimpath \
            -ldflags "-s -w" -o app-runner app-runner.go

      - name: Install host test/build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-system-x86 qemu-utils cpu-checker \
            rsync e2fsprogs zerofree zstd

      - name: Verify KVM
        run: |
          set -e
          sudo modprobe kvm 2>/dev/null || true
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules 2>/dev/null || true
          sudo udevadm trigger --name-match=kvm 2>/dev/null || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm
          kvm-ok

      - name: Build test image (no release upload)
        env:
          APP_URL: "${{ github.event.inputs.app_url }}"
          IMAGE_SIZE_GB: "${{ github.event.inputs.image_size_gb }}"
          ALPINE_BRANCH: "v3.22"
          CGO_COMPAT: "false"
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
          CJK_TTY: "${{ github.event.inputs.cjk_tty }}"
        run: |
          sudo -E bash build/build.sh

      - name: Prepare test copy
        env:
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
          CJK_TTY: "${{ github.event.inputs.cjk_tty }}"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          sudo chown -R "$(id -un):$(id -gn)" .
          RAW="vps-app-runner.img.raw"
          test -s "$RAW"
          cp "$RAW" test.img
          mkdir -p guest-edit
          sudo mount -o loop,offset=1048576 test.img guest-edit
          # Inject a boot-time diagnostic so the guest persists its network /
          # display / process state at boot (the VM is shut down before the
          # checks run, so runtime state must be written by the guest itself).
          sudo cp "$GITHUB_WORKSPACE/test/boot-diag.start" guest-edit/etc/local.d/99-boot-diag.start
          sudo chmod +x guest-edit/etc/local.d/99-boot-diag.start
          if sudo grep -q 'console=ttyS0' guest-edit/boot/extlinux.conf; then
            echo "FAIL: production image contains serial console parameter"
            sudo umount guest-edit; exit 1
          fi
          if [ "$HEADLESS_SSH" != "true" ] && [ "$CJK_TTY" = "true" ]; then
            sudo test -x guest-edit/usr/bin/fbterm
            sudo test -s guest-edit/usr/share/terminfo/f/fbterm
            sudo test -n "$(sudo find guest-edit/usr/share/fonts -type f -iname '*wqy*' | head -1)"
          fi
          sudo umount guest-edit

      - name: Boot under KVM and inspect persisted evidence
        env:
          HEADLESS_SSH: "${{ github.event.inputs.headless_ssh }}"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          timeout --foreground 210 qemu-system-x86_64 \
            -enable-kvm \
            -m 512 -smp 2 \
            -drive format=raw,file=test.img,if=virtio \
            -netdev user,id=n0 -device virtio-net,netdev=n0 \
            -vga std \
            -display none \
            -serial none \
            -monitor none </dev/null >/dev/null 2>&1 &
          QPID=$!

          # No serial console and no QEMU monitor/debug log are used; persisted
          # guest files are the only acceptance evidence.
          sleep 160
          kill "$QPID" 2>/dev/null || true
          for i in $(seq 1 10); do
            kill -0 "$QPID" 2>/dev/null || break
            sleep 1
          done
          kill -9 "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true
          pkill -9 -f 'qemu-system-x86_64.*test.img' 2>/dev/null || true

          mkdir -p guest-root
          sudo mount -o loop,offset=1048576 test.img guest-root

          if [ ! -s guest-root/var/lib/grow-root.done ]; then
            echo "FAIL: boot did not reach persisted grow-root state"; sudo umount guest-root; exit 1
          fi
          echo "PASS: KVM boot reached persisted OpenRC/local state"

          echo "PASS: grow-root service completed"

          FS_SRC="$(findmnt -no SOURCE guest-root)"
          if sudo tune2fs -l "$FS_SRC" 2>/dev/null | grep -qw has_journal; then
            echo "FAIL: ext4 journal still enabled"; sudo umount guest-root; exit 1
          fi
          echo "PASS: ext4 journal disabled"

          # Business download success is the strongest proof the guest network is
          # actually up (persisted, version-independent). Check it first.
          if ! sudo grep -q "downloaded new version" guest-root/var/log/app-runner.log 2>/dev/null; then
            echo "FAIL: business download success not recorded (guest network may be down)"
            echo "--- guest network evidence (diagnostic) ---"
            sudo find guest-root/var/lib/dhcpcd guest-root/run/dhcpcd -type f 2>/dev/null
            sudo ls -la guest-root/etc/resolv.conf 2>/dev/null
            sudo cat guest-root/etc/resolv.conf 2>/dev/null
            sudo tail -20 guest-root/var/log/app-runner.log 2>/dev/null
            echo "--- guest boot-diag log (persisted by guest at boot) ---"
            sudo ls -la guest-root/var/log/boot-diag.log guest-root/var/log/boot-diag.touched guest-root/etc/local.d/ 2>&1
            sudo cat guest-root/var/log/boot-diag.log 2>/dev/null || echo "(no boot-diag.log)"
            sudo umount guest-root; exit 1
          fi
          echo "PASS: business binary downloaded and recorded"

          # DHCP lease file location varies by dhcpcd version; report where leases
          # landed but do not block on a lease file once download already proved
          # the network is up.
          if sudo find guest-root/var/lib/dhcpcd guest-root/run/dhcpcd -type f -size +0c 2>/dev/null | grep -q .; then
            echo "PASS: DHCP lease evidence present"
          else
            echo "WARN: no DHCP lease file on checked paths (network confirmed via download)"
          fi

          if [ "$HEADLESS_SSH" = "true" ]; then
            if ! sudo test -L guest-root/etc/runlevels/default/sshd; then
              echo "FAIL: sshd not enabled in default runlevel"; sudo umount guest-root; exit 1
            fi
            sudo grep -q '^Port 3389$' guest-root/etc/ssh/sshd_config
            sudo test -s guest-root/etc/ssh/ssh_host_ed25519_key
            sudo test -s guest-root/root/.ssh/authorized_keys
            echo "PASS: headless sshd configuration installed"
          fi

          sudo umount guest-root
          echo "--- guest boot-diag log (persisted by guest at boot) ---"
          sudo cat guest-root/var/log/boot-diag.log 2>/dev/null || echo "(no boot-diag.log)"
          echo "PASS: independent KVM boot test completed"
