name: PVE Real-Machine Boot Test

# End-to-end boot test against the multi-tenant Proxmox VE host, tenant API only.
#
# The job pulls the importable qcow2 into the tenant's import storage (a throwaway
# LXC worker downloads it on the node's own network - image bytes never travel
# over the metered tenant tunnel), creates a VM with import-from, boots it, and
# captures a frame through vncproxy + the API gateway's WebSocket. For the
# debug flavor it also attaches to ttyS0 via termproxy and asserts the boot
# selftest. No SSH anywhere.
#
# Credentials come from repository secrets only; this workflow never builds or
# modifies an image - that is build.yml's job.

on:
  workflow_dispatch:
    inputs:
      asset:
        description: "Release asset to boot"
        type: choice
        options: [vpsvga, vpsssh, vpsssh-dbg]
        default: vpsvga
      vga:
        description: "Display adapter to simulate"
        type: choice
        options: [qxl, std, cirrus, virtio, vmware, none]
        default: qxl
      disk_bus:
        description: "Disk bus (scsi = virtio-scsi, virtio = virtio-blk)"
        type: choice
        options: [scsi, virtio]
        default: scsi
      memory_mb:
        description: "Guest memory"
        type: choice
        options: ["512", "768", "1024", "2048"]
        default: "512"
      boot_wait:
        description: "Seconds to wait before capturing the screen"
        type: string
        default: "30"
      serial:
        description: "Assert the boot selftest over the serial console (debug images only)"
        type: boolean
        default: false
      release_tag:
        description: "Release tag holding the asset"
        type: string
        default: dd

permissions:
  contents: read

jobs:
  boot:
    name: boot ${{ inputs.asset }} / ${{ inputs.vga }} / ${{ inputs.disk_bus }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PVE_HOST: ${{ secrets.PVE_HOST }}
      PVE_API_PORT: ${{ secrets.PVE_API_PORT }}
      PVE_USER: ${{ secrets.PVE_USER }}
      PVE_API_PASS: ${{ secrets.PVE_API_PASS }}
      PVE_TLS_FP: ${{ secrets.PVE_TLS_FP }}
      PVE_STORAGE: ${{ secrets.PVE_STORAGE }}
      PVE_POOL: ${{ secrets.PVE_POOL }}
      PVE_FETCH_IP: ${{ secrets.PVE_FETCH_IP }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install client tooling
        run: python -m pip install --quiet requests websocket-client vncdotool

      - name: Import image, boot and capture screen
        run: |
          python .github/pve/pve-e2e.py \
            --tag "${{ inputs.release_tag }}" \
            --asset "${{ inputs.asset }}" \
            --vga "${{ inputs.vga }}" \
            --disk-bus "${{ inputs.disk_bus }}" \
            --memory "${{ inputs.memory_mb }}" \
            --boot-wait "${{ inputs.boot_wait }}" \
            ${{ inputs.serial && '--serial' || '' }}

      - name: Upload screen and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-${{ inputs.asset }}-${{ inputs.vga }}-${{ inputs.disk_bus }}
          path: .github/pve/out/
          retention-days: 14
